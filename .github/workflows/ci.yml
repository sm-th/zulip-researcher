name: CI

on:
  pull_request:
    paths:
      - "zulip_researcher/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Compile
        run: python -m compileall zulip_researcher
      - name: Import smoke
        run: python -c "import zulip_researcher.config, zulip_researcher.zulip, zulip_researcher.prepare, zulip_researcher.models"
      - name: Tests (tolerate none yet)
        run: |
          set +e
          python -m pytest -q
          code=$?
          if [ $code -eq 5 ]; then echo "no tests collected yet"; exit 0; fi
          exit $code
