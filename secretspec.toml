# Declares the secrets zulip-researcher needs -- NOT their values.
# Safe to commit: names and descriptions only, no real accounts/domains.
# See https://secretspec.dev.
#
# The exact provider/search/bluesky set is not finalized yet; those are declared
# optional for now and will be tightened once chosen.
[project]
name = "zulip-researcher"
revision = "1.0"

[profiles.default]
# --- Zulip ---
ZULIP_URL          = { description = "Zulip server base URL", required = true }
ZULIP_API_KEY      = { description = "Zulip bot API key", required = true }
ZULIP_API_USERNAME = { description = "Zulip bot email address", default = "research-bot@example.com" }

# --- Preparation interface ---
PREPARE_URL   = { description = "Preparation interface base URL", required = false }
PREPARE_TOKEN = { description = "Bearer token for the preparation interface", required = false }

# --- Git push / PR (GitHub PAT: wiki PR + push on both Bluesky repos) ---
PUSH_TOKEN = { description = "GitHub PAT for HTTPS push/PR from the sandbox", required = false }

# --- Research agent model provider (omp, Anthropic/OpenAI-compatible) ---
ANTHROPIC_API_KEY = { description = "Anthropic API key for the research agent", required = false }
OPENAI_API_KEY    = { description = "OpenAI-compatible API key for the research agent", required = false }
OPENAI_BASE_URL   = { description = "OpenAI-compatible base URL", required = false }

# --- Web search for the research agent ---
WEB_SEARCH_API_KEY = { description = "Web search provider API key", required = false }

# --- Bluesky app passwords, one per identity (operator / agent) ---
BLUESKY_OPERATOR_APP_PASSWORD = { description = "Bluesky app password for the operator's account", required = false }
BLUESKY_AGENT_APP_PASSWORD    = { description = "Bluesky app password for the agent's account", required = false }
